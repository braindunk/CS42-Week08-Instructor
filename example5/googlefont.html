<!DOCTYPE html>
<html>
  <!-- please feel free to copy the HTML code in this template into any new empty HTML file to include Phaser -->
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>CS42 Week 8 Custom Web Font (Google Fonts) Example</title>
    <!-- load Phaser 3.5.x game engine JavaScript library file via CDN-->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.50.0/dist/phaser-arcade-physics.min.js"></script>
    <!-- per https://stackoverflow.com/questions/51217147/how-to-use-a-local-font-in-phaser-3 -->
    <!-- load Google Font CSS file via CDN (remove &display=swap) -->
    <link href="https://fonts.googleapis.com/css?family=Comic+Neue" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Spicy+Rice" rel="stylesheet">
  </head>
  <!-- easy CSS to make web page background color and remove margins -->
  <body style="background-color:black; margin:0;">
    <!-- display one character using custom font in web page body to force browser to load font -->
    <!-- set font-family to match specific font per example code in Google Fonts -->
    <!-- set color to match background color of body element --> 
    <!-- keep position and z-index properties set as-is --> 
    <div style="font-family:'Comic Neue',cursive; color:black; position:absolute; z-index:-1;">.</div>
    <div style="font-family:'Spicy Rice',cursive; color:black; position:absolute; z-index:-1;">.</div>
    <!-- remember you need to create an external JavaScript file to contain your custom code for the game -->
    <script src="googlefont.js"></script>
  </body>
</html>

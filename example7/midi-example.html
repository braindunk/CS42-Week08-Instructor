<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>CS42 Week 8 Example: MIDI Audio with Tone.js</title>
    <style>
      body { margin:0; background: #000; }
    </style>
    <!-- load Phaser 3.5.x game engine JavaScript library file via local file -->
    <script src="vendors/phaser-arcade-physics.min.js"></script>
    <!-- load web components polyfills js library via local file 
         (source github.com/webcomponents/webcomponentsjs) -->
    <script src="vendors/webcomponents-bundle.js"></script>
    <!-- load MidiConvert js library via local file 
         (source github.com/baweaver/MidiConvert) -->
    <script src="vendors/MidiConvert.js"></script>
    <!-- load Tone.js MIDI js library via local files 
         (source tonejs.github.io) -->
    <script src="vendors/tonejs/Tone.js"></script>
    <script src="vendors/tonejs/tone-ui.js"></script>
    <script src="vendors/tonejs/components.js"></script>
  </head>
  <body>
    <!-- load custom midi audio scripts first -->
    <script src="midi-example-audio.js"></script>
    <!-- load custom phaser game script last -->
    <script src="midi-example.js"></script>
  </body>
</html>
